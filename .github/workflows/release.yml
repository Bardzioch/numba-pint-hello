name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Zainstaluj narzędzia do budowania
        run: |
          pip install --upgrade pip
          pip install build

      - name: Zbuduj paczkę
        run: python -m build

      - name: Opublikuj w Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_TOKEN }}
          repository_url: https://test.pypi.org/legacy/